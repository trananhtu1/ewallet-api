# Cấu hình CHỈ áp dụng khi chạy với profile "prod".
# Kích hoạt bằng: SPRING_PROFILES_ACTIVE=prod  (đặt trên Render)
#
# File này ghi đè application.properties. Ở đó ta rút gọn log cho dễ đọc khi
# ngồi trước máy - trên production thì làm ngược lại, cần đầy đủ thông tin.

# Định dạng đầy đủ: có NGÀY (log Render giữ nhiều ngày, thiếu ngày là vô dụng)
# và TÊN THREAD (nhiều request chạy song song, cần lần theo đúng một request).
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Bật lại thông tin khởi động: cần biết thời gian boot vì Render free bị cold
# start, và cần biết profile nào đang chạy để chắc là nó đọc đúng file này.
spring.main.log-startup-info=true

# Spring trở lại INFO: trên production mấy dòng này là manh mối khi có sự cố.
logging.level.org.springframework=INFO
# Tomcat/Catalina thì vẫn ồn vô ích ở mọi môi trường, giữ WARN.
logging.level.org.apache=WARN
