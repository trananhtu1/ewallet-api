spring.application.name=ewallet-api

# ===== Bớt ồn khi khởi động =====
# Spring và Tomcat mặc định tự thuật lại việc chúng đang khởi động ở mức INFO.
# Đẩy lên WARN thì chúng im, chỉ nói khi có chuyện. Log của mình vẫn hiện.
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
# Trừ dòng này ra - cần biết đang nghe cổng nào, quan trọng nhất lúc deploy.
# Logger cụ thể hơn thắng logger chung hơn, nên dòng này ghi đè dòng trên.
logging.level.org.springframework.boot.tomcat=INFO
# Tắt banner ASCII và dòng "Starting ... using Java ..."
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Rút gọn định dạng cho dễ đọc ở máy mình: giờ, mức, tên class (bỏ package), nội dung.
# %logger{0} = chỉ tên class. Đổi thành %logger{36} nếu muốn thấy cả package.
# LƯU Ý: chỉ nên rút gọn ở local. Trên production giữ định dạng đầy đủ vì cần
# ngày tháng và tên thread để lần theo một request giữa nhiều request đồng thời.
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{0} - %msg%n

# Render KHÔNG cho chọn cổng. Nó cấp cổng qua biến môi trường PORT và
# bắt app phải nghe đúng cổng đó. Thiếu dòng này -> app chạy cổng 8080,
# Render gọi cổng khác, health check trượt -> "Deploy failed".
# 3003 là mặc định khi chạy ở máy mình (không có biến PORT).
server.port=${PORT:3003}

# Đọc thêm file .env nếu có. "optional:" = không có file thì bỏ qua, không lỗi.
# Ở máy mình: có .env (đã gitignore) -> lấy mật khẩu Neon từ đó.
# Trên Render: không có .env -> bỏ qua, lấy từ biến môi trường Render.
# Cùng một file cấu hình chạy được cả hai nơi, không phải sửa code khi deploy.
spring.config.import=optional:file:./.env[.properties]

# CỐ Ý không đặt giá trị mặc định cho 3 dòng dưới.
# Quên set biến trên Render -> app CHẾT NGAY lúc khởi động với thông báo rõ ràng,
# thay vì khởi động thành công rồi 500 ở request đầu tiên có người dùng thật.
# Thà vỡ lúc deploy còn hơn vỡ lúc chạy.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Origin nào được phép gọi API này, phân cách bằng dấu phẩy.
# Có mặc định (khác với datasource ở trên) vì đây không phải bí mật, và để
# clone repo về là chạy được ngay không cần tạo .env.
# Trên Render đổi thành domain Vercel thật:
#   CORS_ALLOWED_ORIGINS=https://ewallet-web.vercel.app
# Để TRỐNG là tái hiện lại lỗi CORS - dùng khi muốn xem lại sự cố.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Neon free giới hạn số kết nối, Render free chỉ có 512MB.
# Mặc định Hikari mở 10 kết nối -> vừa phí RAM vừa dễ chạm giới hạn Neon.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Neon tự ngủ khi không ai dùng, kết nối đầu tiên phải chờ nó thức.
# Mặc định 30s là quá dài để một request treo. 10s rồi báo lỗi tử tế.
spring.datasource.hikari.connection-timeout=10000

# Đừng để app từ chối khởi động chỉ vì Neon đang ngủ.
# Có dòng này: app lên trước, kết nối DB lấy sau khi có request đầu.
spring.datasource.hikari.initialization-fail-timeout=-1

# Không câu lệnh nào được phép CHỜ KHOÁ quá 5 giây.
#
# Mặc định của Postgres là chờ VÔ HẠN. Với một endpoint chuyển tiền thì đó là mặc định sai:
# một dòng ví bị khoá lâu sẽ giữ luôn cả một thread Tomcat và một kết nối trong pool chỉ có 5
# cái - vài request như vậy là cả app đứng, trong khi bản thân database vẫn khoẻ.
#
# Và nó bắt được đúng MỘT LOẠI LỖI mà deadlock_timeout KHÔNG bắt được: transaction ngoài giữ
# khoá trên một dòng, rồi gọi một transaction REQUIRES_NEW đụng vào chính dòng đó. Postgres
# không thấy đây là deadlock (transaction ngoài đâu có chờ khoá nào - nó chờ một lời gọi Java),
# nên nó sẽ treo mãi mãi. Đã đo được ca này khi làm dòng sổ cái FAILED.
#
# 5s > thời gian một lệnh chuyển tiền cần (đo được vài chục ms), nên request thật không đụng.
# Chạm trần là dấu hiệu có gì đó sai, không phải hệ thống bận.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
# ===== JPA / Hibernate =====
#
# ⚠️ HAI DONG DUOI DAY LA HAI DONG QUAN TRONG NHAT CA FILE.
#
# validate, KHONG PHAI update. Flyway la chu cua schema - bang sinh ra tu file trong repo,
# co lich su, co checksum. `update` cho Hibernate tu do them cot moi lan khoi dong, va khi do
# co HAI thu cung sua schema ma khong ai biet cai nao thang. Tren production do la cach mat
# du lieu ma khong co dong log nao giai thich.
#
# `validate` con lam duoc mot viec nua: doi ten mot truong trong entity ma quen viet migration
# thi app CHET NGAY LUC KHOI DONG voi thong bao ro rang, thay vi 500 o request dau tien co
# nguoi dung that. Cung triet ly voi spring.datasource.* khong co gia tri mac dinh.
spring.jpa.hibernate.ddl-auto=validate

# open-in-view=false. Spring Boot mac dinh la TRUE va no la mot cai bay noi tieng:
# session Hibernate duoc giu MO suot ca qua trinh dung JSON tra ve, tuc la mot ket noi
# database bi giu toi tan luc byte cuoi cung roi khoi may chu. Pool o day chi co 5 ket noi.
#
# Doi lai: lazy loading ngoai transaction se nem LazyInitializationException. Do la TINH NANG,
# khong phai phien toai - no bat mot cau truy van an dang nau minh trong tang view lo ra ngay
# luc phat trien, thay vi thanh N+1 tren production.
spring.jpa.open-in-view=false

# In cau SQL Hibernate sinh ra, co xuong dong cho doc duoc. Chi bat o may minh - tren
# production thi day la mot dong log cho MOI cau truy van.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Gom cac lenh INSERT/UPDATE cung loai thanh mot lan goi. Voi Neon o Singapore thi moi vong
# di-ve deu dem duoc, nen day khong phai toi uu som.
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== Flyway =====
# Bang duoc sinh ra tu src/main/resources/db/migration (mac dinh cua Spring Boot,
# khong can khai bao). Chay luc khoi dong, TRUOC khi Tomcat mo cong.
#
# Neon ngu thi Flyway la thang dau tien dam vao. Mac dinh connect-retries=0:
# thu mot lan, truot, app chet. Thu 5 lan cach nhau 5s = doi toi da ~25s.
# Mac dinh cua connect-retries-interval la 120s - qua dai, Render bo cuoc truoc.
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5s

# Muon nhin thay Flyway lam gi luc khoi dong. Dong nay ghi de
# logging.level.org.springframework=WARN o tren (logger cu the hon thang logger
# chung hon) - cung ky thuat da dung cho tomcat.
logging.level.org.flywaydb=INFO

# ===== JWT =====
# CO Y khong co gia tri mac dinh - cung ly do voi spring.datasource.*.
# Quen dat bien tren Render -> app chet ngay luc deploy voi thong bao ro rang,
# thay vi song sot roi phat token ky bang mot chuoi ai cung doan duoc.
#
# HS256 doi khoa it nhat 256 bit = 32 KY TU. Ngan hon la Nimbus nem loi luc khoi dong.
# Sinh khoa: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}

# Token song bao lau. Dinh dang ISO-8601: PT2H = 2 gio, PT15M = 15 phut.
# Ngan thi an toan hon nhung bat dang nhap lai lien tuc; dai thi nguoc lai.
# 2 gio la cho demo. That su thi token ngan + refresh token (Week 4).
# 15 phut, khong phai 2 gio. Do la ca diem cua refresh token: access token ngan thi khe ho
# sau khi thu hoi cung ngan. Truoc PR nay TTL 2 gio nghia la "dang xuat" khong co y nghia gi
# trong 2 tieng - vi JWT khong thu hoi duoc.
app.jwt.ttl=PT15M

# Refresh token song 7 ngay. Day moi la thu quyet dinh nguoi dung bao lau phai go lai mat
# khau. No THU HOI DUOC nen de dai khong nguy hiem nhu de access token dai.
app.jwt.refresh-ttl=P7D

# ===== Tomcat =====
# Mac dinh cua Tomcat la 200 thread va 8192 ket noi - con so danh cho mot may that.
# Goi free cua Render co 0.1 CPU: 200 thread khong lam gi nhanh hon, chi ton stack.
#
# Moi thread giu mot stack rieng (o day 512k, dat trong Dockerfile). 200 thread la
# 100MB stack cho mot app phuc vu vai request mot phut.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200

# ===== Cache =====
# MAC DINH la `none`: khong co Redis thi app van khoi dong binh thuong, chi la khong cache.
#
# Khong dat mac dinh la `redis`: app se khoi dong duoc nhung CHET o request dau tien cham vao
# cache, va thong bao la mot loi ket noi Lettuce chu khong phai "ban quen tao Redis".
#
# Tren Render thi CA HAI bien duoi day do render.yaml dat, khong phai go tay tren dashboard.
#
# ⚠️⚠️ `CACHE_TYPE=none` KHONG PHAI CONG TAC TAT REDIS - va do duoc bao nhieu thi
# no tiet kiem, cau tra loi la GAN NHU KHONG:
#
#     CACHE_TYPE=none   ->  metaspace 114.6 MB
#     CACHE_TYPE=redis  ->  metaspace 114.8 MB     (do 03/09, cung mot ban jar)
#
# Ly do: `DataRedisAutoConfiguration` co dieu kien la @ConditionalOnClass, khong phai
# @ConditionalOnProperty. Chi can spring-data-redis NAM TREN CLASSPATH la Spring dung
# `redisConnectionFactory` va nap het class cua Lettuce, bat ke bien nay la gi. Dat
# `none` chi tat viec DUNG cache, khong tat CHI PHI cua viec co no tren classpath.
#
# 📌 Bai hoc: mot co tat tinh nang tat HANH VI, no khong tat viec NAP CLASS.
#
# Muon doi lai metaspace that su thi phai chan tu auto-configuration:
#
#   spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
#
# De day lam duong thoat hiem, KHONG bat - va no cung khong phai cach chua cua su co
# 03/09: cho do khong phai Redis, xem ghi chu trong Dockerfile.
spring.cache.type=${CACHE_TYPE:none}

# ⭐ MOT bien URL, khong phai HOST + PORT roi.
#
# Doi tu `spring.data.redis.host/port` sang `url` la bi RENDER EP, chu khong phai cho gon:
# trong render.yaml, `fromService` cua mot Key Value instance CHI phoi ra `connectionString`.
# Khong co property `host`, khong co `port` - hai cai do chi danh cho web service va private
# service. Nen muon Render tu dien dia chi Redis vao thi phai nhan mot chuoi duy nhat.
#
# Doi lai duoc mot thu khong nho: chuoi do co ca MAT KHAU khi Key Value bat xac thuc noi bo
# (`redis://user:pass@host:6379`). Neu con giu host/port thi den luc do lai phai them bien
# thu ba cho mat khau - va bien thu ba la bien som muon co ngay bi quen.
#
# Mac dinh localhost:6379 de may ca nhan co Redis chay san thi khong phai dat gi.
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# ===== Upload (KYC) =====
# Chan o TANG SERVLET, truoc khi controller chay mot dong nao. Doc het mot file 2GB len RAM
# roi moi bao "qua lon" la mot duong tan cong bang chinh tinh nang cua minh.
#
# max-file-size  = mot file
# max-request-size = ca request. Phai LON HON 2x file-size vi mot lan nop la HAI anh cong
#                    them phan bao boc multipart.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# ===== Doi soat (reconciliation) =====
# fixedDelay 24h. initial-delay 1 phut de app kip khoi dong xong roi moi quet hai bang.
#
# ⚠️ Trong TEST thi tat (app.reconciliation.enabled=false): job tu chay giua chung se doc
# database dung luc test dang dung du lieu, va ra ket qua doi theo thoi diem - loai test do
# goi la flaky. Test goi thang ReconciliationService.chay() thay vi doi toi gio.
app.reconciliation.enabled=${RECONCILIATION_ENABLED:true}
app.reconciliation.delay=PT24H
app.reconciliation.initial-delay=PT1M
