# Render Blueprint - khai báo hạ tầng bằng file thay vì bấm trên web.
# Lợi ích thật: deploy lại từ đầu hoặc dựng lại sau khi xoá nhầm thì không phải
# nhớ đã bấm những gì. Cấu hình nằm trong git, xem được lịch sử thay đổi.
#
# Cách dùng: Render Dashboard -> New -> Blueprint -> chọn repo này.

services:
  - type: web
    name: ewallet-api
    # Java không có runtime native trên Render, phải qua docker.
    runtime: docker
    plan: free
    # Singapore là region gần Việt Nam nhất, và cùng chỗ với database Neon
    # (ap-southeast-1) -> mỗi truy vấn đỡ đi vòng nửa vòng trái đất.
    region: singapore
    dockerfilePath: ./Dockerfile

    # Render gọi đường dẫn này liên tục để biết app còn sống, và GIẾT app nếu
    # không trả lời kịp. Nên nó phải trỏ vào /ping - endpoint KHÔNG chạm database.
    #
    # Trước đây trỏ vào /health và đó là nguyên nhân lần deploy đầu 20/08 đổ:
    # /health đi hỏi Neon, mật khẩu sai nên Hikari chờ hết connection-timeout 10s,
    # Render bỏ cuộc trước đó. Bài học ghi ở INCIDENTS.md mục 3: liveness probe
    # không được phụ thuộc dịch vụ ngoài. Neon free tự ngủ - kể cả không ai sai
    # mật khẩu thì sớm muộn cũng có ngày deploy trúng lúc nó đang ngủ.
    #
    # /health vẫn còn, vẫn chạm database, vẫn cố ý trả 200 khi DB lỗi - nhưng
    # dành cho người chẩn đoán, không dành cho máy quyết định sống chết.
    healthCheckPath: /ping

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # sync: false = Render HỎI giá trị lúc tạo, KHÔNG lưu vào file này.
      # Bí mật không bao giờ được nằm trong git.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Điền domain Vercel thật sau khi deploy frontend.
      # Sai giá trị này là frontend báo lỗi CORS trên production.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ===== Cache =====
      #
      # ⭐ Hai bien nay truoc day la VIEC TAY: vao dashboard, tao Key Value, copy host va port,
      # dan vao ba o. Ba buoc tay giua mot quy trinh tu dong = ba buoc som muon co ngay bi
      # quen - va da quen that: cache TAT tren production tu 29/08 den 03/09 ma khong ai biet,
      # vi app thieu Redis van chay dung, chi la cham hon.
      #
      # Do la loai loi te nhat: khong co trieu chung. Khong log, khong 500, khong test do.
      # Chi la mot thu minh tin la co ma khong co.
      - key: CACHE_TYPE
        value: redis

      # `fromService` = Render tu dien dia chi cua Key Value instance ben duoi vao day, sau
      # khi tao xong. Khong phai copy tay, va doi ten/tao lai instance thi day tu theo.
      #
      # ⚠️ `property` cua mot keyvalue CHI CO `connectionString`. Khong co `host`, khong co
      # `port` - hai cai do chi danh cho web/private service. Do la ly do application.properties
      # doi sang `spring.data.redis.url`.
      - key: REDIS_URL
        fromService:
          name: ewallet-cache
          type: keyvalue
          property: connectionString

      # Khoa ky JWT.
      #
      # generateValue: true = RENDER TU SINH mot chuoi ngau nhien luc tao bien,
      # va khong ai phai go gi. Truoc day cho nay de sync: false, nghia la
      # "Render se HOI, nguoi deploy tu dan vao" - va do la mot buoc tay giua
      # mot quy trinh tu dong, tuc la mot buoc som muon co ngay bi quen.
      # Quen no thi app chet luc khoi dong voi
      # "Could not resolve placeholder 'JWT_SECRET'".
      #
      # Van an toan bang sync: false ve mat bi mat: gia tri KHONG nam trong file
      # nay, khong vao git. Khac o cho ai sinh ra no - Render chu khong phai
      # nguoi go tay. Va Render sinh chuoi base64 256-bit = 44 ky tu, thoa dieu
      # kien >= 32 ky tu cua HS256.
      #
      # ⚠️ Sinh MOT LAN roi giu nguyen. Neu co ngay nao doi khoa nay (tao lai
      # service chang han) thi MOI token dang luu tren may nguoi dung deu thanh
      # 401 - ho phai dang nhap lai. Voi TTL 2 gio thi do la chuyen cua dung mot
      # lan, va frontend da xu ly san: 401 kem token -> xoa phien -> ve /login.
      - key: JWT_SECRET
        generateValue: true

  # ===================================================================
  # Redis (Render gọi là "Key Value") - cache số dư ví, TTL 10 phút.
  # ===================================================================
  - type: keyvalue
    name: ewallet-cache
    plan: free

    # ⚠️ PHẢI cùng region với web service. Khác region thì hai bên không nhìn
    # thấy nhau qua mạng nội bộ, và `connectionString` trỏ vào một địa chỉ
    # không route tới được - app khởi động bình thường rồi chết ở request đầu
    # tiên chạm cache.
    region: singapore

    # ⭐ `allkeys-lru` chứ KHÔNG phải `noeviction`, và đây là quyết định chứ
    # không phải mặc định.
    #
    # Đầy bộ nhớ thì `noeviction` làm mọi lệnh ghi ĐỔ, còn `allkeys-lru` vứt
    # bớt key lâu không đụng tới. Với một hàng đợi công việc thì `noeviction`
    # mới đúng - mất một job là mất thật. Với CACHE thì ngược lại: vứt một
    # dòng cache đi chỉ tốn thêm một câu truy vấn, còn để lệnh ghi đổ là biến
    # cache thành một chỗ hỏng mới.
    #
    # 📌 Câu để nhớ: cache là thứ MẤT ĐI ĐƯỢC. Nếu mất nó làm hỏng tính đúng
    # đắn thì cái đó không phải cache, nó là database.
    maxmemoryPolicy: allkeys-lru

    # Rỗng = CHỈ cho kết nối từ mạng nội bộ của Render. Trường này BẮT BUỘC với
    # keyvalue (khác web service - bỏ trống ở đó nghĩa là mở cho tất cả).
    #
    # Không mở ra ngoài: Redis không có tài khoản/mật khẩu như Postgres, ai nối
    # được là đọc được sạch. Muốn xem bằng `redis-cli` thì dùng SSH tunnel của
    # Render, đừng mở cổng.
    ipAllowList: []

# Gói free của Key Value KHÔNG lưu xuống đĩa - instance khởi động lại là mất
# sạch dữ liệu. Với cache thì đó đúng là thứ chấp nhận được: mất cache chỉ có
# nghĩa là vài request đầu đi hỏi Postgres.
#
# Và nó KHÔNG hết hạn sau 30 ngày như Postgres free của Render. Mỗi workspace
# được một cái.

# KHÔNG khai báo database ở đây. Database của Render HẾT HẠN SAU 30 NGÀY -
# deploy 23/08 thì nó chết khoảng 22/09, đúng lúc bắt đầu rải CV.
# Dùng Neon (500MB, không hết hạn) và truyền vào qua SPRING_DATASOURCE_URL.
